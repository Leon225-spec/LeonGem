<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ironbyte — Custom Software & Systems</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font preconnect + imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-page: #ffffff;
      --accent-blue: #2563eb;
      --text-main: #0f172a;
      --nav-height: 72px; /* adjustable nav height */
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: var(--text-main);
      background: var(--bg-page);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* reserve space so fixed nav doesn't overlap content */
      padding-top: var(--nav-height);
    }

    /* NAV */
    nav.site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      z-index: 60;
      background: white;
      border-bottom: 1px solid rgba(15,23,42,0.06);
      box-shadow: 0 6px 18px rgba(15,23,42,0.04);
      padding: 0 1.25rem;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 1rem;
    }

    /* Wordmark using Zalando Sans Expanded */
    .wordmark {
      font-family: "Zalando Sans Expanded", "Inter", system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 1.5rem; /* ~24px - not too small */
      color: var(--text-main);
      line-height: 1;
      text-decoration: none;
      display: inline-block;
    }

    /* Accent for 'y' in wordmark */
    .wordmark .accent-y { color: var(--accent-blue); }

    .nav-links {
      display:flex;
      gap:1.25rem;
      align-items:center;
      color: #475569;
      font-weight: 500;
    }

    .nav-links a { color: inherit; text-decoration: none; }
    .nav-cta { display:flex; gap:.75rem; align-items:center; }

    /* subtle background grid & glow */
    .bg-grid {
      background-size: 40px 40px;
      background-image: radial-gradient(circle, rgba(0,0,0,0.05) 1px, transparent 1px);
      position: absolute;
      top: 0; left: 0; right: 0; height: 100vh;
      z-index: -1;
      mask-image: radial-gradient(ellipse at top, black 20%, transparent 80%);
    }

    .glow {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 300px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
      z-index: -1;
      filter: blur(60px);
    }

    .hero-title { letter-spacing: -0.02em; line-height: 1.02; }

    /* responsive tweaks */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .wordmark { font-size: 1.25rem; } /* slightly smaller on mobile but still readable */
    }
  </style>
</head>

<body class="overflow-x-hidden">
  <div class="bg-grid"></div>
  <div class="glow"></div>

  <!-- NAV -->
  <nav class="site-nav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <!-- Wordmark: highlight the 'y' with accent color -->
      <a href="#" class="wordmark" aria-label="ironbyte home">ironbyt<span class="accent-y">e</span></a>

      <!-- center links (hidden on small screens) -->
      <div class="nav-links">
        <a href="#" class="text-sm hover:text-black transition">Services</a>
        <a href="#" class="text-sm hover:text-black transition">Process</a>
        <a href="#" class="text-sm hover:text-black transition">About</a>
      </div>

      <div class="nav-cta">
        <a href="#" class="hidden sm:inline text-sm font-semibold text-gray-700 hover:text-black">Support</a>
        <a href="#" class="inline-block bg-slate-900 text-white text-sm font-semibold px-4 py-2 rounded-md hover:bg-slate-800 transition">Get a quote</a>
      </div>
    </div>
  </nav>

  <!-- HERO: min-height accounts for nav so content sits below navbar -->
  <section class="px-6" style="min-height: calc(100vh - var(--nav-height)); display:flex; align-items:center;">
    <div class="max-w-5xl mx-auto w-full text-center">

      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 border border-blue-100 text-blue-700 text-xs font-bold mb-6 uppercase tracking-wider">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-600"></span>
        </span>
        Custom software studio
      </div>

      <h1 class="hero-title text-4xl md:text-6xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-b from-slate-900 to-slate-600">
        Systems built for <span class="text-blue-600">scale.</span>
      </h1>

      <p class="text-base md:text-lg text-slate-500 mb-6 max-w-2xl mx-auto leading-relaxed">
        Reliable engineering meets practical UX. We build the high-performance internal tools and systems that keep your workflows seamless.
      </p>

      <div class="flex flex-col sm:flex-row justify-center gap-3 mb-6">
        <a href="#" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-semibold text-sm shadow-sm hover:bg-blue-700 hover:-translate-y-0.5 transition">Start a Project</a>
        <a href="#" class="bg-white border border-slate-200 px-6 py-3 rounded-2xl font-semibold text-sm hover:bg-slate-50 transition">View our Process</a>
      </div>

      <div class="mt-2 w-full">
        <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-3">Trusted technology stack</p>
        <div class="flex flex-wrap justify-center items-center gap-6 md:gap-10 opacity-70">
          <img class="h-5 md:h-6" src="https://cdn.worldvectorlogo.com/logos/react-2.svg" alt="React">
          <img class="h-5 md:h-6" src="https://cdn.worldvectorlogo.com/logos/next-js.svg" alt="Next">
          <img class="h-5 md:h-6" src="https://cdn.worldvectorlogo.com/logos/typescript.svg" alt="TypeScript">
          <img class="h-5 md:h-6" src="https://cdn.worldvectorlogo.com/logos/postgresql.svg" alt="Postgres">
          <img class="h-5 md:h-6" src="https://cdn.worldvectorlogo.com/logos/aws-2.svg" alt="AWS">
        </div>
      </div>

    </div>
  </section>
</body>
</html>
