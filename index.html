<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronByte Systems | Efficiency Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #4f46e5;
            --brand-dark: #0f172a;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #334155;
            overflow-x: hidden;
            /* Allow scrolling now that we have more content */
        }

        .gradient-bg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% -5%, rgba(79, 70, 229, 0.04) 0%, rgba(255, 255, 255, 0) 50%);
            z-index: -1;
        }

        .hero-title {
            letter-spacing: -0.04em;
            line-height: 1.05;
        }

        .strikethrough {
            position: relative;
            color: #94a3b8;
            display: inline-block;
        }

        .strikethrough::after {
            content: '';
            position: absolute;
            left: 0;
            top: 55%;
            width: 100%;
            height: 2px;
            background: #ef4444;
            transform: rotate(-2deg);
            border-radius: 2px;
            opacity: 0.8;
        }

        .btn-shadow {
            box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.2);
        }

        .mockup-shadow {
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 2.75rem; }
        }
    </style>
</head>
<body class="min-h-screen">

<div class="gradient-bg"></div>

<!-- Navigation -->
<nav class="w-full max-w-7xl mx-auto px-6 py-5 flex justify-between items-center relative z-10">
    <div class="flex items-center">
        <span class="text-xl font-extrabold tracking-tighter text-slate-900">ironbyte</span>
    </div>
    <button class="p-2 text-slate-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16M4 16h16"></path>
        </svg>
    </button>
</nav>

<!-- Hero Main -->
<main class="max-w-7xl mx-auto px-6 pt-8 md:pt-16 pb-12">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-8 items-center">
        
        <!-- Left: Typography & Actions -->
        <div class="text-center lg:text-left order-2 lg:order-1">
            <div class="mb-4">
                <span class="text-[10px] md:text-[11px] uppercase font-bold tracking-[0.25em] text-slate-400">Efficiency Studio</span>
            </div>

            <h1 class="hero-title text-5xl md:text-7xl font-extrabold text-slate-900 mb-5">
                Operations <span class="strikethrough px-1">chaotic</span><br/>
                <span class="text-indigo-600">made simple.</span>
            </h1>

            <p class="text-[16px] md:text-lg text-slate-500 max-w-md mx-auto lg:mx-0 mb-8 leading-relaxed">
                Track inventory and manage products with DispatchMate, the operating system for modern commerce.
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-3 mb-10">
                <a href="#" class="btn-shadow w-full sm:w-auto px-8 py-3.5 bg-indigo-600 text-white rounded-lg font-bold text-base hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
                    Get Started 
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </a>
                <a href="#" class="w-full sm:w-auto px-8 py-3.5 bg-white text-slate-700 border border-slate-200 rounded-lg font-bold text-base hover:bg-slate-50 transition-all flex items-center justify-center">
                    Contact Us
                </a>
            </div>

            <!-- Social Proof (Ref: Practical UI screenshot) -->

                    <img class="w-10 h-10 rounded-full border-2 border-white bg-slate-200" src="https://i.pravatar.cc/100?u=2" alt="User">
                    <img class="w-10 h-10 rounded-full border-2 border-white bg-slate-200" src="https://i.pravatar.cc/100?u=3" alt="User">
                </div>
                <div class="text-left">
                    <div class="flex text-amber-400">

                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>

                    </div>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-tight">Loved by 2,000+ businesses</p>
                </div>
            </div>
        </div>

        <!-- Right: Visual Screenshot -->
        <div class="order-1 lg:order-2 flex justify-center">
            <div class="relative w-full max-w-sm lg:max-w-md">
                <!-- Decorative element behind image -->
                <div class="absolute -inset-4 bg-indigo-50 rounded-[2.5rem] -rotate-2 -z-10"></div>
                <!-- Mockup Image -->
                <div class="mockup-shadow rounded-2xl border-4 border-white overflow-hidden bg-slate-100 aspect-[4/5] flex items-center justify-center">
                    <div class="text-slate-300 flex flex-col items-center">
                        <svg class="w-16 h-16 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span class="text-xs font-bold tracking-widest uppercase">Visual Preview</span>
                    </div>
                    
                    <img src="Hero.png" class="w-full h-full object-cover" alt="App Screenshot">
                    
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer Logos -->
<footer class="w-full max-w-7xl mx-auto px-6 py-12 border-t border-slate-50">
    <div class="flex flex-wrap justify-center gap-8 md:gap-16 opacity-30 grayscale items-center">
        <div class="text-[10px] font-black italic tracking-tighter text-slate-900 uppercase">Forge</div>
        <div class="text-[10px] font-black italic tracking-tighter text-slate-900 uppercase">Velocity</div>
        <div class="text-[10px] font-black italic tracking-tighter text-slate-900 uppercase">Stratos</div>
        <div class="text-[10px] font-black italic tracking-tighter text-slate-900 uppercase">Nexus</div>
    </div>
</footer>

</body>
</html>
