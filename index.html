      <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ironbyte Systems | Software Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #334155; 
            line-height: 1.625;
            -webkit-font-smoothing: antialiased;
        }

        .content-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 24px 100px 24px;
        }

        /* --- HERO SECTION STYLES --- */
        .hero-section {
            padding-top: 40px;
            margin-bottom: 80px;
        }

        .logo-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }

        /* Tightly spaced, uppercase logo for a more "logo-like" feel */
        .logo-text {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.06em; /* Tight spacing */
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* Accent Indigo from Reference */
        .logo-box {
            border: 2px solid #6366f1;
            padding: 0 4px;
            border-radius: 4px;
            position: relative;
            color: #6366f1;
        }

        .logo-box::before, .logo-box::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border: 1px solid #6366f1;
        }
        .logo-box::before { top: -4px; left: -4px; }
        .logo-box::after { bottom: -4px; right: -4px; }

        .hero-eyebrow {
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: 2.25rem;
            line-height: 1.2;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
        }

        .hero-description {
            font-size: 1.125rem;
            font-weight: 400;
            color: #475569;
            letter-spacing: -0.011em;
            line-height: 1.625;
            margin-bottom: 2.5rem;
        }

        .btn-primary {
            background-color: #6366f1; /* Reference Indigo */
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
            transition: background 0.2s;
        }

        .btn-secondary {
            background-color: white;
            color: #6366f1;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            width: 100%;
            text-align: center;
            border: 1px solid #e2e8f0;
            transition: border-color 0.2s;
        }

        @media (min-width: 640px) {
            .hero-title { font-size: 2.75rem; }
            .btn-primary, .btn-secondary { width: auto; margin-right: 12px; }
        }
    </style>
</head>
<body>

    <main class="content-container">
        
        <!-- HERO SECTION -->
        <section class="hero-section">
            <header class="logo-container">
                <div class="logo-text">
                    IRONBYTE <span class="logo-box">SYSTEMS</span>
                </div>
                <button class="p-2">
                    <svg class="w-8 h-8 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </header>

            <div class="hero-eyebrow">Software Studio</div>
            <h1 class="hero-title">
                Software built for real business operations
            </h1>
            <p class="hero-description">
                IronByte Systems creates practical tools that help teams find products faster, reduce mistakes, and run warehouse and shop operations smoothly.
            </p>
            
            <div class="flex flex-col sm:flex-row gap-2">
                <a href="#" class="btn-primary">View DispatchMate</a>
                <a href="#" class="btn-secondary">Learn More</a>
            </div>
        </section>

    </main>

</body>
</html>
