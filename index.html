<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronByte Systems | Efficiency Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #4f46e5;
            --brand-dark: #0f172a;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #334155;
            overflow: hidden; /* Prevent scrolling if possible for full-screen feel */
        }

        .gradient-bg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% -10%, rgba(79, 70, 229, 0.05) 0%, rgba(255, 255, 255, 0) 60%);
            z-index: -1;
        }

        .hero-title {
            letter-spacing: -0.04em;
            line-height: 1.1;
        }

        .strikethrough {
            position: relative;
            color: #94a3b8;
            display: inline-block;
        }

        .strikethrough::after {
            content: '';
            position: absolute;
            left: 0;
            top: 55%;
            width: 100%;
            height: 3px;
            background: #ef4444;
            transform: rotate(-3deg);
            border-radius: 2px;
            opacity: 0.7;
        }

        .btn-shadow {
            box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.2);
        }

        /* Ensure content fits height on small screens */
        @media (max-height: 700px) {
            .hero-title { font-size: 2.25rem !important; }
            .hero-desc { font-size: 0.95rem !important; margin-bottom: 1.5rem !important; }
            .hero-main { padding-top: 1rem !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<div class="gradient-bg"></div>

<!-- Compact Navigation -->
<nav class="w-full max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center">
        <span class="text-xl font-extrabold tracking-tighter text-slate-900">ironbyte</span>
    </div>
    
    <button class="p-2 text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>
</nav>

<!-- Hero Main - Centered and Reduced Sizes -->
<main class="flex-grow flex flex-col justify-center items-center px-6 text-center hero-main">
    <!-- Hero Content -->
    <div class="mb-4">
        <span class="text-[10px] uppercase font-bold tracking-[0.2em] text-slate-400">Efficiency Studio</span>
    </div>

    <h1 class="hero-title text-4xl md:text-7xl font-extrabold text-slate-900 mb-4">
        Operations <span class="strikethrough px-1">chaotic</span><br/>
        <span class="text-indigo-600">made simple.</span>
    </h1>

    <p class="hero-desc text-base md:text-xl text-slate-500 max-w-md mx-auto mb-8 leading-relaxed">
        Track inventory and manage products with DispatchMate, the operating system for modern commerce.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 w-full max-w-xs sm:max-w-none">
        <a href="#" class="btn-shadow w-full sm:w-auto px-8 py-3.5 bg-indigo-600 text-white rounded-lg font-bold text-base hover:bg-indigo-700 transition-all active:scale-95 flex items-center justify-center gap-2">
            Get Started 
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
        </a>
        <a href="#" class="w-full sm:w-auto px-8 py-3.5 bg-white text-slate-700 border border-slate-200 rounded-lg font-bold text-base hover:bg-slate-50 transition-all flex items-center justify-center">
            Contact Us
        </a>
    </div>
</main>

<!-- Compact Footer Logos -->
<section class="w-full max-w-7xl mx-auto px-6 py-6 mt-auto">
    <div class="flex flex-wrap justify-center gap-6 md:gap-12 opacity-30 grayscale items-center">
        <div class="text-xs font-black italic tracking-tighter text-slate-900 uppercase">Forge</div>
        <div class="text-xs font-black italic tracking-tighter text-slate-900 uppercase">Velocity</div>
        <div class="text-xs font-black italic tracking-tighter text-slate-900 uppercase">Stratos</div>
        <div class="text-xs font-black italic tracking-tighter text-slate-900 uppercase">Nexus</div>
    </div>
</section>

</body>
</html>
