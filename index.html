<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - IronByte Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #334155; 
            line-height: 1.625;
            -webkit-font-smoothing: antialiased;
        }

        .content-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 24px 100px 24px;
        }

        /* --- HERO SECTION STYLES --- */
        .hero-section {
            padding-top: 40px;
            margin-bottom: 80px;
        }

        .logo-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-box {
            border: 2px solid #0ea5e9; /* Sky blue accent */
            padding: 0 4px;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box::before, .logo-box::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border: 1px solid #0ea5e9;
        }
        .logo-box::before { top: -4px; left: -4px; }
        .logo-box::after { bottom: -4px; right: -4px; }

        .hero-eyebrow {
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: 2.25rem;
            line-height: 1.2;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
        }

        .hero-description {
            font-size: 1.125rem;
            font-weight: 400;
            color: #475569;
            letter-spacing: -0.011em;
            line-height: 1.625;
            margin-bottom: 2.5rem;
        }

        .btn-primary {
            background-color: #0ea5e9; /* Sky blue accent */
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-secondary {
            background-color: white;
            color: #0ea5e9; /* Sky blue accent */
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            width: 100%;
            text-align: center;
            border: 1px solid #e2e8f0;
            transition: border-color 0.2s;
            text-decoration: none;
        }

        @media (min-width: 640px) {
            .hero-title { font-size: 2.75rem; }
            .btn-primary, .btn-secondary { width: auto; margin-right: 12px; }
        }
    </style>
</head>
<body>

    <main class="content-container">
        <!-- HERO SECTION -->
        <section class="hero-section">
            <header class="logo-container">
                <div class="logo-text">
                    IRONBYTE
                    <span class="logo-box">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 17l10 5 10-5M2 12l10 5 10-5M12 2L2 7l10 5 10-5-10-5z"/>
                        </svg>
                    </span>
                </div>
                <button class="p-2">
                    <svg class="w-8 h-8 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </header>

            <div class="hero-eyebrow">Software Studio</div>
            <h1 class="hero-title">
                Software built for real business operations
            </h1>
            <p class="hero-description">
                IronByte Systems creates practical tools that help teams find products faster, reduce mistakes, and run warehouse and shop operations smoothly.
            </p>
            
            <div class="flex flex-col sm:flex-row gap-2">
                <a href="#" class="btn-primary">View DispatchMate</a>
                <a href="#" class="btn-secondary">Learn More</a>
            </div>

            <!-- Social Proof -->
            <div class="mt-12 flex items-center gap-4">
                <div class="flex -space-x-2">
                    <img src="https://i.pravatar.cc/100?u=tech1" class="w-10 h-10 rounded-full border-2 border-white" alt="user">
                    <img src="https://i.pravatar.cc/100?u=tech2" class="w-10 h-10 rounded-full border-2 border-white" alt="user">
                    <img src="https://i.pravatar.cc/100?u=tech3" class="w-10 h-10 rounded-full border-2 border-white" alt="user">
                </div>
                <div>
                    <div class="flex text-yellow-400">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">Loved by thousands</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
