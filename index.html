<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ironbyte — Custom Software & Systems</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #ffffff;
      --accent-blue: #2563eb;
      --text-main: #0f172a;
    }

    body {
      background-color: var(--bg-page);
      font-family: "Inter", sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .bg-grid {
      background-size: 40px 40px;
      background-image: radial-gradient(circle, rgba(0,0,0,0.05) 1px, transparent 1px);
      position: absolute;
      top: 0; left: 0; right: 0; height: 100vh;
      z-index: -1;
      mask-image: radial-gradient(ellipse at top, black 20%, transparent 80%);
    }

    .glow {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 300px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
      z-index: -1;
      filter: blur(60px);
    }

    .hero-title {
      letter-spacing: -0.05em;
      line-height: 0.95;
    }

    .ui-mockup {
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::after {
      content: "";
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
      transition: 0.5s;
    }
    .btn-shine:hover::after { left: 100%; }
  </style>
</head>

<body class="overflow-x-hidden">
  <div class="bg-grid"></div>
  <div class="glow"></div>

  <nav class="fixed w-full top-0 z-50 px-6 py-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center bg-white/70 backdrop-blur-xl border border-gray-200/50 px-5 py-2.5 rounded-2xl shadow-sm">
      
      <a href="#" class="flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect x="20" y="25" width="50" height="50" rx="12" fill="#1e293b"/>
  <path d="M40 40 V60 M40 50 H50 A5 5 0 0 1 50 60 A5 5 0 0 1 40 60" 
        stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="58" cy="40" r="5" fill="url(#blueGrad)"/>

  <g font-family="Arial, sans-serif" font-weight="800" font-size="32" letter-spacing="-1">
    <text x="85" y="62" fill="#1e293b">IRON</text>
    <text x="168" y="62" fill="url(#blueGrad)">BYTE</text>
  </g>
  
  <rect x="85" y="70" width="160" height="2" rx="1" fill="#e2e8f0"/>
</svg>
      </a>

      <div class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-500">
        <a href="#" class="hover:text-black transition-colors">Services</a>
        <a href="#" class="hover:text-black transition-colors">Process</a>
        <a href="#" class="hover:text-black transition-colors">About</a>
      </div>

      <div class="flex items-center gap-4">
        <a href="#" class="hidden sm:block text-sm font-semibold text-gray-900">Support</a>
        <a href="#" class="bg-slate-900 text-white text-sm font-semibold px-5 py-2.5 rounded-xl hover:bg-slate-800 transition-all btn-shine">
          Get a quote
        </a>
      </div>
    </div>
  </nav>

  <section class="pt-40 pb-20 px-6">
    <div class="max-w-4xl mx-auto text-center">
      
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 border border-blue-100 text-blue-700 text-xs font-bold mb-8 uppercase tracking-wider">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-600"></span>
        </span>
        Custom software studio
      </div>

      <h1 class="hero-title text-5xl md:text-8xl font-black mb-8 bg-clip-text text-transparent bg-gradient-to-b from-slate-900 to-slate-600">
        Systems built for <span class="text-blue-600">scale.</span>
      </h1>

      <p class="text-lg md:text-xl text-slate-500 mb-10 max-w-2xl mx-auto leading-relaxed">
        Reliable engineering meets practical UX. We build the high-performance internal tools, dashboards, and systems that keep your workflow seamless.
      </p>

      <div class="flex flex-col sm:flex-row justify-center gap-4 mb-20">
        <a href="#" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-1 transition-all">
          Start a Project
        </a>
        <a href="#" class="bg-white border border-slate-200 px-8 py-4 rounded-2xl font-bold text-lg hover:bg-slate-50 transition-all">
          View our Process
        </a>
      </div>

      <div class="relative max-w-5xl mx-auto group">
        <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-2xl blur opacity-10 group-hover:opacity-20 transition duration-1000"></div>
        <div class="ui-mockup relative bg-white flex flex-col items-start p-2">
            <div class="w-full h-6 border-b border-gray-100 flex items-center gap-1.5 px-3 mb-2">
                <div class="w-2 h-2 rounded-full bg-gray-200"></div>
                <div class="w-2 h-2 rounded-full bg-gray-200"></div>
                <div class="w-2 h-2 rounded-full bg-gray-200"></div>
            </div>
            <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=2000" class="rounded-lg grayscale-[0.5] hover:grayscale-0 transition-all duration-700" alt="Dashboard Preview">
        </div>
      </div>

      <div class="mt-20">
        <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-8">Trusted technology stack</p>
        <div class="flex flex-wrap justify-center items-center gap-10 md:gap-16 opacity-40 hover:opacity-100 transition-opacity duration-500">
          <img class="h-6 md:h-8" src="https://cdn.worldvectorlogo.com/logos/react-2.svg" alt="React">
          <img class="h-6 md:h-8" src="https://cdn.worldvectorlogo.com/logos/next-js.svg" alt="Next">
          <img class="h-6 md:h-8" src="https://cdn.worldvectorlogo.com/logos/typescript.svg" alt="TS">
          <img class="h-6 md:h-8" src="https://cdn.worldvectorlogo.com/logos/postgresql.svg" alt="Postgres">
          <img class="h-6 md:h-8" src="https://cdn.worldvectorlogo.com/logos/aws-2.svg" alt="AWS">
        </div>
      </div>

    </div>
  </section>
</body>
</html>
