<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ironbyte - Build and Deploy</title>
    
    <!-- Import Inter font for that premium, clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config and Custom Animations -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        background: '#FFFFFF',
                        foreground: '#0A0A0A',
                        muted: '#737373',
                    },
                    letterSpacing: {
                        tighter: '-0.04em',
                        tight: '-0.02em',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base styles to ensure light mode and smooth rendering */
        body {
            background-color: #FFFFFF;
            color: #0A0A0A;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Techy Grid Background with fade-out mask */
        .bg-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            -webkit-mask-image: radial-gradient(ellipse at center top, black 20%, transparent 70%);
            mask-image: radial-gradient(ellipse at center top, black 20%, transparent 70%);
        }

        /* Staggered animation delays for the hero elements */
        .animate-delay-100 { animation-delay: 100ms; }
        .animate-delay-200 { animation-delay: 200ms; }
        .animate-delay-300 { animation-delay: 300ms; }

        /* Subtle button hover shadow */
        .btn-secondary:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col overflow-x-hidden selection:bg-black/10 selection:text-black">

    <!-- Techy subtle grid background (fades out at edges) -->
    <div class="absolute inset-0 bg-grid -z-10 pointer-events-none"></div>

    <!-- Subtle top glow for depth -->
    <div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[80%] max-w-[800px] h-[500px] bg-slate-200/[0.5] blur-[120px] rounded-full pointer-events-none -z-10"></div>

    <!-- Navigation -->
    <nav class="w-full px-6 py-5 flex justify-between items-center z-50">
        <a href="#" class="flex items-center gap-3 transition-opacity hover:opacity-80">
            <!-- Recreated Ironbyte Logo (Dark for light mode) -->
            <div class="w-7 h-7 bg-black rounded-lg shadow-[0_2px_10px_rgba(0,0,0,0.1)]"></div>
            <span class="font-medium text-lg tracking-tight text-black">ironbyte</span>
        </a>
        <button class="text-black/70 hover:text-black transition-colors" aria-label="Menu">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </nav>

    <!-- Hero Section -->
    <main class="flex-1 flex flex-col items-center justify-center px-6 pt-12 pb-24 text-center z-10 relative">
        
        <div class="max-w-[800px] w-full flex flex-col items-center">
            
            <!-- Headline -->
            <h1 class="text-[44px] sm:text-[64px] md:text-[80px] font-medium leading-[1.05] tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-black to-black/70 mb-6 opacity-0 animate-fade-in-up">
                Build and deploy<br class="hidden sm:block" />
                game-changing<br class="hidden sm:block" />
                platforms.
            </h1>
            
            <!-- Subtitle -->
            <p class="text-[17px] sm:text-[20px] text-muted leading-[1.5] max-w-[480px] sm:max-w-[600px] mb-10 opacity-0 animate-fade-in-up animate-delay-100 font-normal">
                ironbyte develops software and AI agents that transform how businesses operate. Starting on the warehouse floor. Scaling to the world.
            </p>
            
            <!-- CTA Buttons -->
            <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto opacity-0 animate-fade-in-up animate-delay-200">
                
                <!-- Primary Button -->
                <a href="#" class="group relative flex items-center justify-center gap-2 w-full sm:w-auto bg-black text-white px-8 py-3.5 rounded-full font-medium text-[15px] transition-all hover:bg-[#1A1A1A] active:scale-[0.98] shadow-[0_4px_14px_0_rgba(0,0,0,0.1)]">
                    Explore Products
                    <i data-lucide="arrow-right" class="w-4 h-4 transition-transform group-hover:translate-x-0.5"></i>
                </a>
                
                <!-- Secondary Button -->
                <a href="#" class="btn-secondary flex items-center justify-center w-full sm:w-auto bg-white text-black px-8 py-3.5 rounded-full font-medium text-[15px] border border-black/10 transition-all hover:bg-gray-50 active:scale-[0.98]">
                    Get Early Access
                </a>
                
            </div>
            
        </div>
    </main>

    <script>
        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
